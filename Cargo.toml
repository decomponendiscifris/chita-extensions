# The extensions written in Rust, and the SDK they're written with, as one workspace: one
# lockfile for the reviewer to read, one build for CI. `chita ext build` builds a member with
# the release profile below (small modules).
[workspace]
resolver = "3"
members = ["sdk/rust", "extensions/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"

# Small modules: what every extension ships as.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
